project_id = "lrfdtoexyeghrzynapyn"

# Fixed, non-default ports so this stack can run alongside other local
# Supabase projects (e.g. Nalecce-Event on 554xx) without port conflicts.
[api]
enabled = true
port = 56321

[db]
port = 56322

[db.pooler]
port = 56329

[studio]
enabled = true
port = 56323

[local_smtp]
enabled = true
port = 56324

[analytics]
enabled = true
port = 56327

[edge_runtime]
inspector_port = 56328

# PHC Sales OS backend layer. The gateway verifies the caller's JWT; the
# function then resolves roles and authorizes each sensitive action in code.
[functions.sales-os-api]
verify_jwt = true

# Called by Postmark, not a browser: there is no user JWT to verify. The function
# authenticates with HTTP Basic credentials in the webhook URL instead. With the
# default (true) the gateway would reject every client reply before the code ran.
[functions.mail-inbound]
verify_jwt = false

# Polled by Outlook on its own schedule, with no session. The token in the query
# string is the credential and the function enforces it; with the gateway default
# every subscription fetch would be refused.
[functions.calendar-feed]
verify_jwt = false

# Called by Fireflies.ai when a meeting is processed, never by a browser: there is
# no user JWT. The function verifies the x-hub-signature HMAC over the raw body
# itself; with the gateway default every webhook would be refused unread.
[functions.meetings-inbound]
verify_jwt = false

# Microsoft redirects the browser here after a salesperson signs in to connect
# Outlook: there is no user JWT on that request. The function authenticates it
# by the one-time state stored (hashed) by sales-os-api's outlook_connect_start.
[functions.outlook-connector]
verify_jwt = false

# Called by pg_cron every five minutes, never by a browser: there is no user JWT.
# The function authenticates the call by a key kept only in Vault (see
# 20261003100000_outlook_capture.sql), which the cron job reads when it runs.
[functions.outlook-sync]
verify_jwt = false
