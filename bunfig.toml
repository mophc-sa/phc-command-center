[install]
# 3-day supply-chain guard: skip package versions published less than three days
# ago (raised from 24h after the 2026-10-07 security audit).
minimumReleaseAge = 259200
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/vite-plugin-dev-server-bridge", "@lovable.dev/vite-plugin-hmr-gate"]

[test]
# Exclude the Lovable export snapshot — it contains Playwright specs that are
# incompatible with bun:test and reference files that are not active test code.
exclude = ["exports-inspected/**"]
