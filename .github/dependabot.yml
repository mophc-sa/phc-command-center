version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    # Supply-chain cooldown: wait a week before proposing a newly published version.
    cooldown:
      default-days: 7
    # typescript-eslint does not support TypeScript 7 yet (2026-11-18); revisit when it does.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    # Supply-chain cooldown: wait a week before proposing a newly published version.
    cooldown:
      default-days: 7
