name: Production Readiness

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Approved PHC deployment URL to test
        required: true
        default: https://agent.phc-sa.com
        type: choice
        options:
          - https://agent.phc-sa.com
          - https://phc-canary-mophc-sa-phc-command-center.phc-sa.workers.dev

permissions:
  contents: read
  actions: read

jobs:
  role-matrix:
    uses: ./.github/workflows/isolated-readiness.yml
  deployment-smoke:
    name: Deployed authentication boundary without test accounts
    needs: role-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-readiness
    env:
      TEST_APP_URL: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify canary identity before testing
        if: contains(inputs.app_url, 'workers.dev')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/verify-release-evidence.ts readiness
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Verify deployed public login and unauthenticated guards
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.TEST_APP_URL }}
        # Role/account/MFA assertions run in the required isolated job above.
        # The deployed check performs no authenticated production actions.
        run: bunx playwright test tests/e2e/auth-guards.e2e.ts --grep "auth page smoke|unauthenticated guard" --workers=1 --reporter=list,./tests/e2e/readiness-reporter.ts
      - name: Recheck canary identity after testing
        if: contains(inputs.app_url, 'workers.dev')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/verify-release-evidence.ts readiness
          echo "$GITHUB_SHA" > "${RUNNER_TEMP}/readiness-sha.txt"
      - name: Preserve passing canary readiness receipt
        if: contains(inputs.app_url, 'workers.dev')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/readiness-sha.txt
          retention-days: 7
          if-no-files-found: error
