name: Deploy Cloudflare Worker

# MANUAL ONLY — there is deliberately no `push` trigger.
#
# This workflow used to carry `push: branches: [main]`, which meant every
# merged PR cut over agent.phc-sa.com with no human in the loop. That
# contradicted the project's own written rule: docs/deployment-governance.md
# says "Every production change requires an explicit approval gate" and
# "production deployment must remain manual and approval-gated", and CLAUDE.md
# says deployments "must never be triggered automatically by merging to main".
#
# It went unnoticed because it was harmless for a while — the PRs that merged
# were migrations and tests, so the redeployed bundle was identical. The first
# PR carrying frontend changes would have shipped straight to production on
# merge. Merging is now decoupled from deploying: CI still runs on every push
# to main (see ci.yml); shipping is a separate, deliberate act.
on:
  # Manual dispatch: choose canary (version upload, no traffic cut) or
  # production (full cutover to agent.phc-sa.com).
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: canary
        type: choice
        options:
          - canary
          - production
      confirm:
        # A dropdown left on the wrong option is one click from a live
        # cutover. Production additionally requires typing the domain, so
        # deploying production is something you can only do on purpose.
        description: 'To deploy production, type: agent.phc-sa.com'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # One deployment per target at a time; canary and production are separate.
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-cloudflare
    env:
      DEPLOY_TARGET: ${{ inputs.target }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      WORKER_NAME: mophc-sa-phc-command-center
      DNS_RECORD_NAME: agent.phc-sa.com
      WRANGLER_VERSION: 4.112.0

    steps:
      # Defence in depth. Removing the `push` trigger is the actual fix; this
      # step is what fails loudly if anyone ever adds an automatic trigger
      # back, instead of the deployment quietly succeeding again.
      - name: Refuse any non-manual trigger
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "Production deploys are manual only. This run was triggered by '${GITHUB_EVENT_NAME}'." >&2
            echo "See docs/deployment-governance.md — merging to main must not deploy." >&2
            exit 1
          fi
          echo "Trigger is workflow_dispatch."

      - name: Require explicit confirmation for production
        if: inputs.target == 'production'
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "${DNS_RECORD_NAME}" ]; then
            echo "Production cutover requires typing '${DNS_RECORD_NAME}' in the confirm field." >&2
            echo "Received: '${CONFIRM:-<empty>}'" >&2
            exit 1
          fi
          echo "Production cutover confirmed by ${GITHUB_ACTOR}."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Normalize and verify Cloudflare deployment access
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          # Cloudflare API tokens never contain whitespace. Removing it here
          # protects deployments from line breaks accidentally pasted into the
          # GitHub Environment secret, which otherwise produce an invalid HTTP
          # Authorization header before Wrangler can authenticate.
          token="${RAW_CLOUDFLARE_API_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          token="${token//$'\t'/}"
          token="${token// /}"
          if [ -z "$token" ]; then
            echo "Missing required production-cloudflare value: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing required production-cloudflare value: CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi

          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"

          if ! bindings="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${token}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets")"; then
            echo "Cloudflare API token cannot read the production Worker secrets. Verify the token value, account scope, and Workers Scripts Write permission." >&2
            exit 1
          fi
          jq -e '.success == true and (.result | type == "array")' <<<"$bindings" >/dev/null || {
            echo "Cloudflare returned an unexpected Worker secrets response." >&2
            exit 1
          }
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            jq -e --arg name "$name" 'any(.result[]; .name == $name)' <<<"$bindings" >/dev/null || {
              echo "Missing required Worker secret binding: $name" >&2
              exit 1
            }
          done
          echo "Cloudflare deployment access and Worker secret bindings verified."

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID SUPABASE_PROJECT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production-cloudflare value: $name" >&2
              exit 1
            fi
          done
          case "$SUPABASE_URL" in
            https://lrfdtoexyeghrzynapyn.supabase.co) ;;
            *) echo "Refusing to deploy with an unexpected Supabase project URL" >&2; exit 1 ;;
          esac

      - run: bun install --frozen-lockfile

      - name: Verify source
        run: bun run verify

      - name: Upload canary version
        if: env.DEPLOY_TARGET == 'canary'
        shell: bash
        run: |
          set -euo pipefail

          # The upload is the deployment; everything after it is verification.
          #
          # This step used to do two things wrong, and they compounded. It
          # required a *.workers.dev URL in wrangler's stdout and failed hard
          # without one — but a Worker served only through a custom domain
          # emits no preview URL unless Preview URLs is enabled for it, which
          # is a separate setting from the workers.dev subdomain. And the
          # `grep` that looked for the URL was unguarded under `set -e` with
          # `pipefail`, so a no-match exit 1 killed the script one line BEFORE
          # the `if` that would have explained why. Two canary runs failed on
          # 2026-08-24 with a successful upload, a valid version id, and no
          # message at all.
          #
          # So: the version id is what proves the upload worked, and it is
          # required. The preview URL is a bonus — used for a real health check
          # when Cloudflare provides one, and reported as a warning when it
          # does not. A canary that uploaded correctly should not be recorded
          # as a failed deployment because an optional URL was absent.
          output="$(bunx wrangler@${WRANGLER_VERSION} versions upload \
            --config .output/server/wrangler.json \
            --name "$WORKER_NAME" \
            --preview-alias phc-canary \
            --keep-vars \
            --message "Canary ${GITHUB_SHA}")"
          printf '%s\n' "$output"

          # `|| true` on every grep below: no-match is exit 1, and under
          # pipefail that aborts the step before it can say anything.
          version_id="$(grep -Eo 'Worker Version ID: [0-9a-f-]+' <<<"$output" | tail -1 | awk '{print $NF}' || true)"
          if [ -z "$version_id" ]; then
            echo "wrangler reported no Worker Version ID — the upload did not complete." >&2
            exit 1
          fi
          echo "Canary version uploaded: ${version_id}"

          canary_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' <<<"$output" | tail -1 || true)"
          if [ -n "$canary_url" ]; then
            curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${canary_url}/auth" >/dev/null
            echo "Canary health check passed: ${canary_url}/auth"
            {
              echo "### Canary deployed"
              echo ""
              echo "- version: \`${version_id}\`"
              echo "- url: ${canary_url}"
              echo "- health check: \`${canary_url}/auth\` responded"
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No canary preview URL::Version ${version_id} uploaded, but Cloudflare returned no *.workers.dev preview URL. Enable Preview URLs for ${WORKER_NAME} (Settings -> Domains & Routes) to get an isolated canary origin. No health check was performed."
            {
              echo "### Canary uploaded, not verifiable"
              echo ""
              echo "- version: \`${version_id}\`"
              echo "- url: none — Preview URLs appears to be disabled for \`${WORKER_NAME}\`"
              echo "- health check: **not performed**"
              echo ""
              echo "The version exists and routes no traffic. There is no isolated origin to test against,"
              echo "so treat this as an upload, not as a verified canary."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Snapshot production DNS for rollback
        if: env.DEPLOY_TARGET == 'production'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${DNS_RECORD_NAME}")"
          jq -e '.success == true' <<<"$response" >/dev/null
          record_count="$(jq '.result | length' <<<"$response")"
          if [ "$record_count" -lt 1 ]; then
            echo "No existing DNS record found for ${DNS_RECORD_NAME}; refusing production cutover" >&2
            exit 1
          fi
          jq '[.result[] | {id, type, name, content, proxied, ttl}]' <<<"$response" \
            >"${RUNNER_TEMP}/agent-dns-before.json"
          echo "Captured ${record_count} pre-cutover DNS record(s) for ${DNS_RECORD_NAME}."

      - name: Preserve production DNS rollback snapshot
        if: env.DEPLOY_TARGET == 'production'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-dns-before-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-dns-before.json
          retention-days: 90
          if-no-files-found: error

      - name: Deploy production custom domain
        if: env.DEPLOY_TARGET == 'production'
        shell: bash
        run: |
          set -euo pipefail
          bunx wrangler@${WRANGLER_VERSION} deploy \
            --config .output/server/wrangler.json \
            --name "$WORKER_NAME" \
            --domain agent.phc-sa.com \
            --keep-vars \
            --message "Production ${GITHUB_SHA}"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://agent.phc-sa.com/auth >/dev/null
          echo "Production health check passed: https://agent.phc-sa.com/auth"
