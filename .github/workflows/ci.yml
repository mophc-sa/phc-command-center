name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run typecheck
      - name: Supabase Edge Function check
        run: deno check --import-map supabase/functions/import_map.json supabase/functions/sales-os-api/index.ts
      - name: Unit and contract tests
        run: bun run test
      - name: Production build
        run: bun run build

  playwright-smoke:
    runs-on: ubuntu-latest
    # The whole job normally finishes in about a minute. Without a cap, a
    # hung step runs to the 6-hour default — which is exactly what happened on
    # 2026-08-19: "Install Playwright browsers" stalled twice for 20+ minutes
    # and blocked a merge, with no way to tell a hang from slowness.
    timeout-minutes: 15
    needs: typecheck-build
    permissions:
      contents: read
    env:
      # Nitro/wrangler stamp the built Worker's compatibility_date to "today"
      # when unset. wrangler's local dev runtime (used below to serve the app
      # for these smoke tests) ships a workerd binary that only supports
      # compatibility dates up to its own release date, so as soon as a new
      # calendar day starts, "today" can outrun whatever wrangler version CI
      # just resolved and the local server refuses to start. Pin to a fixed,
      # known-good past date instead — this only affects this local smoke-test
      # server, not the production Cloudflare deploy (which uploads to
      # Cloudflare's edge and doesn't run a local workerd runtime). Bump this
      # occasionally; it doesn't need to track "today".
      COMPATIBILITY_DATE: "2026-06-01"
      TEST_APP_URL: ${{ secrets.TEST_APP_URL }}
      TEST_SYSTEM_ADMIN_EMAIL: ${{ secrets.TEST_SYSTEM_ADMIN_EMAIL }}
      TEST_SYSTEM_ADMIN_PASSWORD: ${{ secrets.TEST_SYSTEM_ADMIN_PASSWORD }}
      TEST_MANAGING_DIRECTOR_EMAIL: ${{ secrets.TEST_MANAGING_DIRECTOR_EMAIL }}
      TEST_MANAGING_DIRECTOR_PASSWORD: ${{ secrets.TEST_MANAGING_DIRECTOR_PASSWORD }}
      TEST_GENERAL_MANAGER_EMAIL: ${{ secrets.TEST_GENERAL_MANAGER_EMAIL }}
      TEST_GENERAL_MANAGER_PASSWORD: ${{ secrets.TEST_GENERAL_MANAGER_PASSWORD }}
      TEST_SALES_MANAGER_EMAIL: ${{ secrets.TEST_SALES_MANAGER_EMAIL }}
      TEST_SALES_MANAGER_PASSWORD: ${{ secrets.TEST_SALES_MANAGER_PASSWORD }}
      TEST_BD_MANAGER_EMAIL: ${{ secrets.TEST_BD_MANAGER_EMAIL }}
      TEST_BD_MANAGER_PASSWORD: ${{ secrets.TEST_BD_MANAGER_PASSWORD }}
      TEST_SALESPERSON_EMAIL: ${{ secrets.TEST_SALESPERSON_EMAIL }}
      TEST_SALESPERSON_PASSWORD: ${{ secrets.TEST_SALESPERSON_PASSWORD }}
      TEST_VIEWER_EMAIL: ${{ secrets.TEST_VIEWER_EMAIL }}
      TEST_VIEWER_PASSWORD: ${{ secrets.TEST_VIEWER_PASSWORD }}
      TEST_SALES_OPS_EMAIL: ${{ secrets.TEST_SALES_OPS_EMAIL }}
      TEST_SALES_OPS_PASSWORD: ${{ secrets.TEST_SALES_OPS_PASSWORD }}
      TEST_CEO_EMAIL: ${{ secrets.TEST_CEO_EMAIL }}
      TEST_CEO_PASSWORD: ${{ secrets.TEST_CEO_PASSWORD }}
      TEST_PENDING_EMAIL: ${{ secrets.TEST_PENDING_EMAIL }}
      TEST_PENDING_PASSWORD: ${{ secrets.TEST_PENDING_PASSWORD }}
      TEST_SUSPENDED_EMAIL: ${{ secrets.TEST_SUSPENDED_EMAIL }}
      TEST_SUSPENDED_PASSWORD: ${{ secrets.TEST_SUSPENDED_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Cache the browser binaries. This step used to re-download Chromium on
      # every run (~28s when the network cooperates, unbounded when it does
      # not). The key is the resolved Playwright version, so a version bump
      # invalidates it automatically.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        # Two attempts: the download is the one step in this job that depends
        # on a third-party CDN, and a transient stall should cost a retry, not
        # a red build. --with-deps still runs on a cache hit so the OS
        # libraries chromium links against are present.
        run: |
          for attempt in 1 2; do
            if timeout 300 bunx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          echo "::error::Playwright browser install failed twice"
          exit 1
      - name: Build app
        run: bun run build
      - name: Start app
        run: |
          bun run preview --port 8080 &
          echo "APP_PID=$!" >> $GITHUB_ENV
          for i in {1..30}; do
            curl -sf http://localhost:8080 > /dev/null && break
            sleep 1
          done
      - name: Playwright smoke (skips roles without credentials)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.TEST_APP_URL || 'http://localhost:8080' }}
        run: bunx playwright test
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Stop app
        if: always()
        run: kill $APP_PID || true
