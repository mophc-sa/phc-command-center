name: Isolated Readiness
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  isolated-readiness:
    name: Isolated role, account and MFA checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPATIBILITY_DATE: '2026-08-26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
      - run: bun install --frozen-lockfile
      - name: Configure disposable local Auth
        run: |
          cat >> supabase/config.toml <<'CONFIG'

          [auth.rate_limit]
          sign_in_sign_ups = 1000
          token_refresh = 1000
          token_verifications = 1000
          [auth.mfa.totp]
          enroll_enabled = true
          verify_enabled = true
          CONFIG
      - name: Start disposable Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: Provision local accounts and MFA
        run: |
          umask 077
          supabase status --output json > "$RUNNER_TEMP/local-supabase.json"
          bun scripts/isolated-e2e/provision.ts "$RUNNER_TEMP/local-supabase.json"
          rm "$RUNNER_TEMP/local-supabase.json"
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - name: Start app against local database
        run: |
          bun run preview --port 8080 > "$RUNNER_TEMP/phc-app.log" 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/auth >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Require every role and account-state test
        run: bun run test:e2e:readiness -- --workers=1 --max-failures=3
      - name: Cleanup accounts, sessions and database
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then kill "$APP_PID" || true; fi
          rm -rf test-results/.auth-session-cache
          rm -f "$RUNNER_TEMP/local-supabase.json"
          supabase stop --no-backup
